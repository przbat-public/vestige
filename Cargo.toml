[workspace]
resolver = "2"
members = [
    "crates/vestige-core",
    "crates/vestige-mcp",
    "crates/vestige-restore",
    "tests/e2e",
    "benchmarks/locomo",
]
exclude = [
    "fastembed-rs",
]

[workspace.package]
version = "3.3.0"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-only"
authors = ["Sam Valladares"]
repository = "https://github.com/samvallad33/vestige"

[workspace.dependencies]
# Share deps across workspace. Crates opt-in via `<dep>.workspace = true`.
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
directories = "6"
rusqlite = { version = "0.39", features = ["chrono", "serde_json"] }
regex = "1"
tempfile = "3"

# Internal crates — declared here with `version + path` so consumers don't
# emit a wildcard dependency (cargo deny rejects `path = "..."` alone because
# it implicitly resolves to `version = "*"`).
vestige-core = { version = "3.3.0", path = "crates/vestige-core", default-features = false }

[workspace.lints.clippy]
# Restriction lint added in clippy 1.81 (2024-09): scoped visibility modifiers
# on struct fields (`pub(super)`, `pub(crate)`, `pub(in path)`) are flagged as
# a code smell because they let any code inside the visibility window mutate
# the field without going through the type's API, so invariants have to be
# verified across the whole window. We document conscious uses with
# `#[allow(clippy::field_scoped_visibility_modifiers, reason = "...")]` on the
# owning struct (typical case: split-by-responsibility refactor where sibling
# submodules share the parent module's trust level). New occurrences without a
# justification are caught by this lint.
field_scoped_visibility_modifiers = "warn"

# Catch debugging leftovers and unfinished work before they reach main.
# `dbg!()` is fine in REPL exploration but should never land in committed code.
# `todo!()` and `unimplemented!()` panic at runtime — they signal "I'll come
# back to this" intent that needs an explicit plan, not a silent panic in
# production. Suppress with `#[allow(clippy::todo, reason = "tracked in #NNN")]`
# when you genuinely want to ship a TODO marker.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
# opt-level = 3: maximize runtime speed (search, embeddings, RRF, BM25 are hot).
# Earlier "z" optimised binary size at the cost of ~5–15% throughput on the
# hot path — wrong trade-off for a long-running MCP server.
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Use `cargo build --profile=dist` when you specifically need the smallest
# possible binary (e.g. a curl-piped download) and accept slower runtime.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"

[profile.dev]
opt-level = 1
