[package]
name = "vestige-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cognitive memory MCP server for AI assistants - FSRS-6, spreading activation, synaptic tagging, 3D dashboard, content intelligence pipeline"
keywords = ["mcp", "ai", "memory", "fsrs", "neuroscience", "cognitive-science", "spaced-repetition"]
categories = ["command-line-utilities", "database"]

[features]
default = ["embeddings", "vector-search", "preprocessing"]
embeddings = ["vestige-core/embeddings"]
vector-search = ["vestige-core/vector-search"]
# Content Intelligence Pipeline (entity extraction, coreference, temporal anchoring,
# relation extraction, provenance). Without this feature, smart_ingest skips
# enrichment and provenance fields are not populated. v3.2+
preprocessing = ["vestige-core/preprocessing"]
# Mutually exclusive with bundled-sqlite — see vestige-core for usage.
encryption = ["vestige-core/encryption"]
# Apple Silicon Metal GPU acceleration for embeddings (fastembed)
metal = ["vestige-core/metal"]
# OpenTelemetry / OTLP export. OFF by default so the binary stays lean —
# turn on when shipping to an environment with an OTLP collector. With the
# feature off, `telemetry::init` is a no-op and reports `FeatureDisabled`.
# Real OTLP exporter wiring lands in a follow-up once we agree on the
# concrete dependency set (opentelemetry / opentelemetry-otlp /
# tracing-opentelemetry — gated here to keep the default build fast).
telemetry = []

[[bin]]
name = "vestige-mcp"
path = "src/main.rs"

# a13: `vestige-restore` lives in its own crate (`crates/vestige-restore`) so
# it can be built without fastembed/USearch. The old bin path stayed here
# briefly during the audit; do not re-add it.

[[bin]]
name = "vestige"
path = "src/bin/cli/main.rs"

[dependencies]
# ============================================================================
# VESTIGE CORE - The cognitive science engine
# Includes: FSRS-6, spreading activation, synaptic tagging, hippocampal indexing,
# memory states, context memory, importance signals, dreams, preprocessing
# ============================================================================
vestige-core = { workspace = true, features = ["bundled-sqlite"] }

# ============================================================================
# Workspace-shared deps
# ============================================================================
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true

# Async runtime with io-std for stdio MCP transport
tokio = { workspace = true, features = ["full", "io-std"] }

# SQLite for WAL checkpoint helper at shutdown
rusqlite = { workspace = true, features = ["bundled"] }

# ============================================================================
# MCP-specific deps
# ============================================================================
# Constant-time comparison for auth tokens (prevents timing side-channels)
subtle = "2"

# CLI
clap = { version = "4", features = ["derive"] }
colored = "3"

# Dashboard (v3.0+) — Axum HTTP/WS + React SPA embedded via include_dir!
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "ws"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "set-header", "limit"] }
futures-util = "0.3"
open = "5"

# Embedded dashboard build (apps/dashboard/build → React SPA)
include_dir = "0.7"
mime_guess = "2"

# Generates TypeScript bindings for wire-format DTOs. The `#[derive(TS)]`
# attribute on `dashboard::wire::*` types is the source of truth for the
# dashboard's `apps/dashboard/src/types/generated/*.ts` files; running
# `cargo test -p vestige-mcp` regenerates them. The `chrono-impl` feature
# maps `DateTime<Utc>` to a TypeScript `string` (we always serialize as
# RFC 3339 on the wire). `format` would pull in dprint-plugin-typescript
# but biome reformats the output anyway.
ts-rs = { version = "12", features = ["chrono-impl", "no-serde-warnings"] }

[dev-dependencies]
tempfile.workspace = true
# `start_paused = true` requires test-util explicitly — it isn't in tokio's
# `full` feature set. Keeps the production binary lean.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
