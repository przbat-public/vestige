name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g., v2.0.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cargo_flags: ""
          # ARM Linux for AWS Graviton, Raspberry Pi 4+, and Apple-Silicon
          # Linux VMs (UTM/Lima/OrbStack). `packages/vestige-mcp-npm`
          # postinstall.js maps `linux+arm64` → this archive name, so without
          # it ARM Linux users hit HTTP 404 on `npm install`. Uses GitHub's
          # native ARM runner (GA, October 2025) — no cross-compile or QEMU.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            cargo_flags: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            cargo_flags: ""
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
            cargo_flags: "--no-default-features"
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            cargo_flags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build vestige-mcp + vestige CLI
        run: cargo build --package vestige-mcp --release --target ${{ matrix.target }} ${{ matrix.cargo_flags }}

      # a13: vestige-restore lives in its own crate and is built without
      # fastembed/USearch so its release tarball stays small.
      - name: Build vestige-restore (no embeddings)
        run: cargo build --package vestige-restore --release --target ${{ matrix.target }} ${{ matrix.cargo_flags }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../vestige-mcp-${{ matrix.target }}.tar.gz vestige-mcp vestige vestige-restore

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path vestige-mcp.exe,vestige.exe,vestige-restore.exe -DestinationPath ../../../vestige-mcp-${{ matrix.target }}.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: vestige-mcp-${{ matrix.target }}.${{ matrix.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
