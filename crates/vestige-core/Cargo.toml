[package]
name = "vestige-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cognitive memory engine - FSRS-6 spaced repetition, semantic embeddings, and temporal memory"
keywords = ["memory", "spaced-repetition", "fsrs", "embeddings", "knowledge-graph"]
categories = ["science", "database"]

[features]
default = ["embeddings", "vector-search", "bundled-sqlite", "preprocessing"]

# Content preprocessing: entity extraction, coreference rewriting, temporal anchoring,
# relation extraction — all local heuristic/regex, no model downloads, sub-ms latency
preprocessing = ["dep:natural-date-rs", "dep:regex"]

# SQLite backend (default, unencrypted)
bundled-sqlite = ["rusqlite/bundled"]

# Encrypted SQLite via SQLCipher (mutually exclusive with bundled-sqlite)
# Use: --no-default-features --features encryption,embeddings,vector-search
# Set VESTIGE_ENCRYPTION_KEY env var to enable encryption
encryption = ["rusqlite/bundled-sqlcipher"]

# Core embeddings with fastembed (ONNX-based, local inference)
embeddings = ["dep:fastembed"]

# HNSW vector search with USearch (in-memory ANN; persisted to a sidecar + loaded on startup, rebuild-from-SQLite fallback)
vector-search = ["dep:usearch"]

# Nomic Embed Text v2 MoE (475M params, 305M active, Candle backend)
# Requires: fastembed with nomic-v2-moe feature
nomic-v2 = ["embeddings", "fastembed/nomic-v2-moe"]

# ColBERT late-interaction reranking (token-level MaxSim over the top-K
# candidates from hybrid retrieval). fastembed cannot emit ColBERT's per-token
# matrix (it pools to one vector), so we run the ONNX model directly via `ort`
# and tokenize with `tokenizers`. Depends on `embeddings` so fastembed provides
# the shared, already-downloaded ort runtime — pulling a second ort build would
# bloat the binary and risk a TLS-backend clash. Inert unless
# VESTIGE_LATE_INTERACTION is set at runtime.
late-interaction = ["embeddings", "dep:ort", "dep:tokenizers"]

# Qwen3 Reranker (Candle backend, high-precision cross-encoder)
qwen3-reranker = ["embeddings", "fastembed/qwen3"]

# Metal GPU acceleration on Apple Silicon (significantly faster inference)
metal = ["fastembed/metal"]


[dependencies]
# Workspace-shared deps (kept in [workspace.dependencies] for version unity)
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
directories.workspace = true
rusqlite.workspace = true
# Async runtime (required for codebase module)
tokio = { workspace = true }

# Git integration for codebase memory
# vendored-openssl: Compile OpenSSL from source for cross-compilation support
git2 = { version = "0.20", features = ["vendored-openssl"] }

# File watching for codebase memory
notify = "8"

# ============================================================================
# OPTIONAL: Embeddings (fastembed v5 - local ONNX inference)
# ============================================================================
# nomic-embed-text-v1.5: 768 dimensions, 8192 token context, Matryoshka support
# v5.11: Adds Nomic v2 MoE (nomic-v2-moe feature) + Qwen3 reranker (qwen3 feature)
#
# We disable fastembed's defaults to:
#   1. Swap native-tls → rustls (eliminates bare `openssl` from the dep graph,
#      which `cargo deny` bans in favour of rustls or vendored-openssl).
#   2. Drop `image-models` — Vestige only does text embeddings, so the entire
#      image crate stack is dead weight.
fastembed = { version = "5.13", default-features = false, features = [
    "hf-hub-rustls-tls",
    "ort-download-binaries-rustls-tls",
], optional = true }

# ============================================================================
# OPTIONAL: Vector Search (USearch HNSW; in-memory only for now)
# ============================================================================
# 2.26.2 adds bounds checks to the serialized-header parser that 2.25.2 lacked:
# the memory-mapped `view()` path trusted `matrix_rows * matrix_cols` from the
# file and could describe a span past the end of the mapping. This crate calls
# only `save`/`load`, so the check is defence in depth for the HNSW sidecar.
usearch = { version = "2.26.2", optional = true }

# Late-interaction (ColBERT) reranker. `ort` is pinned to the EXACT version
# fastembed uses so cargo unifies them into a single ONNX runtime build;
# default-features = false because the download-binaries + rustls runtime feature
# is supplied (and unified) by fastembed's `ort-download-binaries-rustls-tls`.
# `tokenizers` loads the ColBERT tokenizer.json from a local file (no `http`/`onig`
# pre-tokenizer needed for the BERT WordPiece path).
ort = { version = "=2.0.0-rc.12", default-features = false, optional = true }
tokenizers = { version = "0.22", default-features = false, optional = true }

# LRU cache for query embeddings
lru = "0.16"

# ============================================================================
# OPTIONAL: Content Preprocessing (local NLP, no LLM required)
# ============================================================================
# natural-date-rs: parse "next Monday", "3 weeks from now" → absolute dates
natural-date-rs = { version = "0.3", optional = true }

# Regex for entity extraction & temporal pattern matching
regex = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "search_bench"
harness = false

[lib]
name = "vestige_core"
path = "src/lib.rs"

# Enable doctests
doctest = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
