name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily security audit so new advisories surface even without code changes.
    - cron: "0 5 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  VESTIGE_TEST_MOCK_EMBEDDINGS: "1"

# Cancel previous runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    name: Metadata Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-version-and-tools.sh

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [metadata]
    steps:
      - uses: actions/checkout@v4
      # actions-rust-lang/setup-rust-toolchain auto-detects rust-toolchain.toml,
      # so the workflow always uses the same compiler the repo pins (1.91.0).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Check & Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [metadata]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  doc:
    name: Rustdoc
    runs-on: ubuntu-latest
    needs: [metadata]
    timeout-minutes: 15
    env:
      # Treat any warning (broken intra-doc links, unclosed HTML tags, etc.)
      # as a CI failure so we don't accumulate the kind of drift we just cleaned up.
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib

  mcp-tests:
    name: MCP E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --package vestige-mcp
      - run: cargo test --package vestige-e2e-tests --test mcp_protocol -- --test-threads=1

  journey-tests:
    name: User Journey Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --package vestige-e2e-tests --test journey_tests -- --test-threads=1

  audit:
    name: Cargo Audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Run on its own — independent of other jobs so a single advisory
    # doesn't block the rest of CI before maintainers can triage it.
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Cargo Deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # `advisories` runs in the dedicated `audit` job above so we don't
          # double-report. Here we enforce only the deterministic checks.
          command: check bans licenses sources

  dashboard:
    name: Dashboard Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dashboard check
      - run: pnpm --filter dashboard test
      - run: pnpm --filter dashboard build

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  release-build:
    name: Release Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: github.ref == 'refs/heads/main'
    needs: [unit-tests, mcp-tests]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            cargo_flags: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cargo_flags: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release (mcp + restore)
        run: |
          cargo build --release --target ${{ matrix.target }} -p vestige-mcp ${{ matrix.cargo_flags }}
          cargo build --release --target ${{ matrix.target }} -p vestige-restore ${{ matrix.cargo_flags }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../vestige-mcp-${{ matrix.target }}.tar.gz vestige-mcp vestige vestige-restore
      - uses: actions/upload-artifact@v4
        with:
          name: vestige-mcp-${{ matrix.target }}
          path: vestige-mcp-${{ matrix.target }}.tar.gz
