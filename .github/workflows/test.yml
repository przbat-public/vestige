name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily security audit so new advisories surface even without code changes.
    # Only the security jobs (metadata / audit / deny) run on this schedule —
    # everything else is gated with `github.event_name != 'schedule'` so the
    # nightly run does not rebuild the whole workspace and the release binaries.
    - cron: "0 5 * * *"

# Least privilege for every job. The GITHUB_TOKEN needs to read the repo and
# nothing else; `audit` opts into checks/issues write (rustsec/audit-check
# publishes a check-run and can open an issue with its findings) and no other
# job widens this.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Offline, deterministic embeddings for every job. The switch is read by
  # `vestige_core::embeddings::mock_embeddings_enabled`
  # (crates/vestige-core/src/embeddings/local.rs): while it is on, the ONNX
  # forward pass is replaced by a hash of the text — same 384 dimensions,
  # L2-normalised, lexically meaningful — so the semantic path
  # (embeddings → HNSW → RRF) is exercised without downloading the ~547 MB
  # model on a cold cache. It is a *runtime* switch: it cannot change the
  # artifacts release.yml compiles.
  # No test asserts real-model behaviour (nothing pins `model_name()`,
  # `is_ready()` or a similarity value, and every decision assertion expects
  # "create", which the mock reproduces), and tests/e2e forces the same value
  # onto the server processes it spawns (tests/e2e/src/harness/mcp_process.rs).
  # Set it to "0" for a run that must load the real model.
  VESTIGE_TEST_MOCK_EMBEDDINGS: "1"

# Cancel previous runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs (the tag is kept as a trailing comment
# so Dependabot for `github-actions` can still bump them). A moving tag can be
# re-pointed by whoever controls the action.
jobs:
  metadata:
    name: Metadata Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: ./scripts/check-version-and-tools.sh
      # The MCPB bundle is assembled by hand (`packages/vestige-mcpb/build.sh`
      # then `mcpb pack`), and nothing checked that manifest.json, launch.sh and
      # build.sh agree — which is how the ARM64 Linux binary shipped without any
      # host being able to select it. Static check: no network, no binaries, no
      # Rust toolchain.
      - run: ./packages/vestige-mcpb/check-manifest.sh
      # `npm install vestige-mcp-server` downloads a release archive and then
      # executes what is inside it, so the wrapper verifies the published
      # `<archive>.sha256` before extracting anything (fail-closed on a
      # mismatch, explicit warning when a release predates the checksums). The
      # test is hermetic — node:test plus builtins, local tarballs, no network —
      # and needs no dependency install.
      - run: node --test packages/vestige-mcp-npm/scripts/binary-install.test.js

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [metadata]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # actions-rust-lang/setup-rust-toolchain auto-detects rust-toolchain.toml,
      # so the workflow always uses the same compiler the repo pins (1.91.0).
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Check & Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [metadata]
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  check-minimal:
    name: Check (--no-default-features)
    runs-on: ubuntu-latest
    needs: [metadata]
    if: github.event_name != 'schedule'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: no-default-features
      # `--no-default-features` (keyword-only: no embeddings / vector search /
      # preprocessing) is a documented, supported build — AGENTS.md and README
      # both advertise it, and release.yml shipped exactly this feature set for
      # macOS Intel until the Intel target moved to a native runner. Nothing in
      # CI compiled it, so a cfg-gating regression could only surface at release
      # time. `cargo check` covers the library + binary targets of that exact
      # configuration without paying for a full release build; tests and benches
      # are deliberately excluded because they are not what ships.
      - run: cargo check -p vestige-mcp -p vestige-restore --no-default-features

  check-windows:
    name: Check (windows-latest)
    runs-on: windows-latest
    needs: [metadata]
    if: github.event_name != 'schedule'
    # Cold Windows cache: the workspace builds fastembed / ort / tokenizers /
    # rusqlite / usearch from scratch, which is slower than the POSIX runners.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows
      # release.yml ships x86_64-pc-windows-msvc (and the npm wrapper maps
      # win32+x64 onto that archive), but nothing in CI ever compiled the
      # workspace for Windows: a cfg- or dependency-level break could only
      # surface while tagging a release. release.yml runs with fail-fast: false,
      # so the other targets would still publish and Windows users would get a
      # 404 from postinstall.
      #
      # Compile-only, and deliberately NOT part of the `check` matrix that
      # unit-tests / mcp-tests / journey-tests depend on: this job adds platform
      # coverage without gating the rest of the pipeline. Clippy stays on the two
      # POSIX runners — turning on `-D warnings` for a platform that has never
      # been linted is a separate change.
      - run: cargo check --workspace --all-targets --all-features

  doc:
    name: Rustdoc
    runs-on: ubuntu-latest
    needs: [metadata]
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    env:
      # Treat any warning (broken intra-doc links, unclosed HTML tags, etc.)
      # as a CI failure so we don't accumulate the kind of drift we just cleaned up.
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --workspace --no-deps --all-features

  wire-contract:
    name: Wire DTO → Generated TypeScript
    runs-on: ubuntu-latest
    needs: [metadata]
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wire-contract
      # scripts/check-generated-types.sh regenerates the ts-rs declarations and
      # fails on any drift (`git diff --exit-code`). README, ARCHITECTURE,
      # AGENTS, CONTRIBUTING and wire/mod.rs all advertise it as a CI gate, but
      # no workflow ever called it — this step is that gate.
      - run: ./scripts/check-generated-types.sh

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --lib

  mcp-tests:
    name: MCP E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --package vestige-mcp
      - run: cargo test --package vestige-e2e-tests --test mcp_protocol -- --test-threads=1

  journey-tests:
    name: User Journey Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit-tests]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --package vestige-e2e-tests --test journey_tests -- --test-threads=1

  audit:
    name: Cargo Audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Run on its own — independent of other jobs so a single advisory
    # doesn't block the rest of CI before maintainers can triage it. This is
    # also the job the nightly schedule exists for, so it is never gated.
    #
    # rustsec/audit-check is the only consumer that needs more than the
    # workflow-default `contents: read`: it publishes a check-run and can file
    # an issue for the advisories it finds.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Cargo Deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deterministic checks, cheap enough to keep in the nightly security run.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # `advisories` runs in the dedicated `audit` job above so we don't
          # double-report. Here we enforce only the deterministic checks.
          command: check bans licenses sources

  dashboard:
    name: Dashboard Build & Test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # The package name is `vestige-dashboard` (apps/dashboard/package.json),
      # not `dashboard` — using the wrong filter silently turned this job into a
      # no-op for months ("No projects matched the filters", exit 0). Belt and
      # braces: actually resolve the filter to a directory and fail when it
      # matches nothing, which is the guard the old comment promised.
      - name: Guard — filter must resolve to apps/dashboard
        run: |
          if ! pnpm --filter vestige-dashboard exec pwd | grep -q '/apps/dashboard$'; then
            echo "::error::pnpm --filter vestige-dashboard did not resolve to apps/dashboard — refusing to run a silent no-op"
            exit 1
          fi
      # `run ci` (note the explicit `run`) expands to
      # `tsc --noEmit && biome check . && vitest run`, i.e. the gate AGENTS.md
      # documents. A bare `pnpm ci` would hit pnpm's built-in `ci` command
      # (alias of `install --frozen-lockfile`) and never run the script — which
      # is why Biome never ran in CI.
      - run: pnpm --filter vestige-dashboard run ci
      - run: pnpm --filter vestige-dashboard build
      # apps/dashboard/build/ is committed and embedded into the binary with
      # include_dir!, so a stale bundle ships an old UI while the sources look
      # current (CONTRIBUTING.md asks for a manual `pnpm build` before commit).
      - name: Guard — committed bundle must match a fresh build
        run: |
          if ! git diff --exit-code --stat -- apps/dashboard/build/; then
            echo "::error::apps/dashboard/build/ is out of date — run 'pnpm --filter vestige-dashboard build' and commit the rebuilt bundle"
            exit 1
          fi

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: llvm-tools-preview
      # `tool: cargo-llvm-cov` replaces the floating `@cargo-llvm-cov` ref with
      # the same tool requested through a pinned action version.
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: lcov.info
          fail_ci_if_error: false

  release-build:
    name: Release Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    needs: [unit-tests, mcp-tests]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            cargo_flags: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cargo_flags: ""
          # Catch ARM Linux build regressions on every push to main, not just
          # at release time (release.yml ships the matching archive).
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cargo_flags: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build release (mcp + restore)
        run: |
          cargo build --release --target ${{ matrix.target }} -p vestige-mcp ${{ matrix.cargo_flags }}
          cargo build --release --target ${{ matrix.target }} -p vestige-restore ${{ matrix.cargo_flags }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../vestige-mcp-${{ matrix.target }}.tar.gz vestige-mcp vestige vestige-restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vestige-mcp-${{ matrix.target }}
          path: vestige-mcp-${{ matrix.target }}.tar.gz

  glibc-smoke:
    name: glibc Smoke (Ubuntu 22.04, glibc 2.35)
    runs-on: ubuntu-latest
    needs: [release-build]
    # release-build only runs on main; this job consumes the exact tarball it
    # produced (no second compilation) and inherits that gate.
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      # The Linux archives are built on ubuntu-latest (glibc 2.39) but are
      # downloaded by users on Ubuntu 22.04 / Debian 12. Running the shipped
      # binary inside ubuntu:22.04 catches a dependency that started requiring
      # a newer glibc symbol — a failure mode that only shows up on user
      # machines. `docker run` (not a job container) keeps the runner's Node.js
      # available for the actions above.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vestige-mcp-x86_64-unknown-linux-gnu
      - name: Run shipped Linux binaries on glibc 2.35
        run: |
          set -euo pipefail
          tar -xzf vestige-mcp-x86_64-unknown-linux-gnu.tar.gz
          chmod +x vestige-mcp vestige vestige-restore
          docker run --rm -v "$PWD:/art:ro" ubuntu:22.04 sh -c '
            set -e
            ldd --version | head -n 1
            /art/vestige-mcp --version
            /art/vestige --version
            # vestige-restore has no --version flag: it prints usage and exits 1.
            # Assert that usage text instead — a glibc symbol mismatch fails in
            # the dynamic loader, before main() ever runs.
            restore_out="$(/art/vestige-restore 2>&1 || true)"
            echo "$restore_out"
            echo "$restore_out" | grep -q "Usage: vestige-restore"
          '
