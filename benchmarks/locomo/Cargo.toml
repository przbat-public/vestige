[package]
name = "vestige-locomo-bench"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "LoCoMo benchmark harness for Vestige — measures long-term conversational memory quality"

[[bin]]
name = "locomo-bench"
path = "src/main.rs"

[dependencies]
vestige-core = { workspace = true, features = ["embeddings", "vector-search", "preprocessing"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
